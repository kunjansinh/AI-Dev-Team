services:
  ai-dev-team:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-dev-team
    ports:
      - "8000:8000"
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000